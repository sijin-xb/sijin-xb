name: snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8839ef&color_dots=#e6e9ef,#d7c5f2,#c3a4ec,#ac82e6,#8839ef
            dist/github-snake-dark.svg?color_snake=#cba6f7&color_dots=#313244,#6e5aa8,#8f77c4,#b195e0,#cba6f7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
